name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host unit + scenario tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared headers in sync
        run: python3 tools/sync_check.py
      - name: Unit and regression tests
        run: make -C tests run
      - name: Scenario runs (CSV)
        run: make -C tests csv

  firmware-build:
    name: Compile all 14 sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install cores and library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@2.12.0 esp32:esp32@3.1.3
          arduino-cli lib install "LiquidCrystal I2C"
      - name: Build
        run: tools/build_all.sh
